<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Accotech AI</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0f1420;
        color: #e7ebf5;
        font-family: "Segoe UI", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .splash {
        text-align: center;
      }
      .logo {
        width: 80px;
        height: 80px;
        border-radius: 20px;
        background: linear-gradient(135deg, #5b8cff, #8b5cf6);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        font-weight: 800;
        color: white;
        margin-bottom: 20px;
        box-shadow: 0 10px 40px rgba(91, 140, 255, 0.35);
      }
      h1 {
        margin: 0;
        font-size: 20px;
        letter-spacing: 1px;
      }
      p {
        color: #8892a6;
        margin-top: 8px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 2px;
      }
      .loader {
        width: 160px;
        height: 3px;
        background: #232a3e;
        border-radius: 999px;
        overflow: hidden;
        margin: 28px auto 0;
        position: relative;
      }
      .loader::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, #5b8cff, transparent);
        animation: sweep 1.4s ease-in-out infinite;
      }
      @keyframes sweep {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <div class="logo">A</div>
      <h1>ACCOTECH AI</h1>
      <p>Starting Tally Automation…</p>
      <div class="loader"></div>
    </div>
  </body>
</html>
